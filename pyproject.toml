[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gonka-poc"
version = "0.1.4"
description = "Out-of-tree vLLM plugin for Gonka Proof-of-Compute v2 (vllm 0.25.x / 0.28.x)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kaitaku.ai" }]
keywords = ["vllm", "gonka", "proof-of-compute", "llm", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "vllm>=0.25.0,<0.29",
  "torch",
  "numpy",
  "scipy>=1.10",
  "aiohttp>=3.9",
  "fastapi<0.137",
  "pydantic>=2",
  "starlette",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-asyncio",
  "httpx",
  "scipy>=1.10",
  "aiohttp>=3.9",
]

[project.urls]
# Ownership note: the plugin is being handed over to the gonka-ai organisation.
# These point at the current (pre-transfer) location; they are updated together
# with the install instructions in README.md once the transfer completes, so the
# docs and the package metadata never disagree.
Repository = "https://github.com/kaitakuai/gonka-poc"
Issues = "https://github.com/kaitakuai/gonka-poc/issues"

[project.entry-points."vllm.general_plugins"]
gonka_poc = "gonka_poc.plugin:register"

[project.scripts]
gonka-vllm-serve = "gonka_poc.entrypoint.api_router:main"

[tool.setuptools.package-data]
"gonka_poc.poc" = ["sphere_codebook.pt"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gonka_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
